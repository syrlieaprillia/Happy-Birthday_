<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0f5">
    <title>Happy 20th Birthday ♡</title>
    <link rel="stylesheet" href="cake.css">
</head>
<body>

    <div class="background">
        <span>♡</span><span>✦</span><span>✧</span>
        <span>♡</span><span>✦</span><span>✧</span>
        <span>♡</span><span>✦</span><span>♡</span>
    </div>

    <main class="birthday-container">

        <p class="eyebrow">A SPECIAL DAY FOR YOU</p>
        <h1>Happy Birthday!</h1>
        <p class="subtitle">Twenty looks beautiful on you ♡</p>

        <div class="cake-scene">
            <div class="cake-shadow"></div>

            <div class="cake-display" id="cake">

                <div class="top-candles">
                    <button class="candle regular-candle c1" aria-label="Lilin 1">
                        <span class="flame"></span>
                        <span class="wick"></span>
                        <span class="stick"></span>
                    </button>

                    <button class="candle regular-candle c2" aria-label="Lilin 2">
                        <span class="flame"></span>
                        <span class="wick"></span>
                        <span class="stick"></span>
                    </button>

                    <button class="candle regular-candle c3" aria-label="Lilin 3">
                        <span class="flame"></span>
                        <span class="wick"></span>
                        <span class="stick"></span>
                    </button>

                    <button class="candle regular-candle c4" aria-label="Lilin 4">
                        <span class="flame"></span>
                        <span class="wick"></span>
                        <span class="stick"></span>
                    </button>

                    <button class="candle regular-candle c5" aria-label="Lilin 5">
                        <span class="flame"></span>
                        <span class="wick"></span>
                        <span class="stick"></span>
                    </button>
                </div>

                <div class="upper-tier">

                    <div class="upper-top">
                        <span class="berry berry1">🍓</span>
                        <span class="berry berry2">🍓</span>
                        <span class="berry berry3">🍓</span>
                    </div>

                    <div class="upper-body">
                        <div class="drip u1"></div>
                        <div class="drip u2"></div>
                        <div class="drip u3"></div>
                        <div class="drip u4"></div>
                        <div class="drip u5"></div>

                        <div class="upper-decoration">
                            <span>♡</span>
                            <span>✿</span>
                            <span>♡</span>
                        </div>

                        <div class="upper-piping"></div>
                    </div>
                </div>

                <div class="lower-tier">

                    <div class="lower-top"></div>

                    <div class="lower-body">

                        <div class="drip l1"></div>
                        <div class="drip l2"></div>
                        <div class="drip l3"></div>
                        <div class="drip l4"></div>
                        <div class="drip l5"></div>
                        <div class="drip l6"></div>
                        <div class="drip l7"></div>

                        <div class="age-decoration">
                            <span>20</span>
                            <small>♡</small>
                        </div>

                        <div class="lower-decoration">
                            <span>✿</span>
                            <span>♡</span>
                            <span>✿</span>
                            <span>♡</span>
                            <span>✿</span>
                        </div>

                        <div class="lower-piping"></div>
                    </div>
                </div>

                <div class="cake-plate">
                    <div class="plate-shine"></div>
                </div>

            </div>
        </div>

        <p class="instruction" id="instruction">
            A little birthday magic ♡
        </p>

        <p class="candle-hint">
            Tap each candle to blow it out ♡
        </p>

    </main>

    <audio id="birthdayMusic" preload="auto">
        <source src="musik/hbd.mp3" type="audio/mpeg">
    </audio>

    <script src="cake.js"></script>
</body>
</html>
