<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You've Got Mail ♡</title>

    <link rel="stylesheet" href="package.css">
</head>

<body>

    <!-- Dekorasi -->
    <div class="decor decor-1">♡</div>
    <div class="decor decor-2">✦</div>
    <div class="decor decor-3">♡</div>
    <div class="decor decor-4">✧</div>


    <main class="page">

        <!-- =================================
             JUDUL
        ================================== -->

        <section class="intro">

            <p class="tiny-text">
                a little something for you ♡
            </p>

            <h1>
                you've got mail
            </h1>

            <p class="subtitle">
                someone sent you a little care package 📦
            </p>

        </section>


        <!-- =================================
             PACKAGE
        ================================== -->

        <section class="package-area">

            <div class="package-shadow"></div>


            <div
                class="package"
                id="package"
                onclick="openPackage()"
            >

                <!-- BOX TOP -->
                <div class="box-top">

                    <div class="tape"></div>

                </div>


                <!-- BOX BODY -->
                <div class="box-body">

                    <!-- LABEL -->
                    <div class="package-label">

                        <div class="label-title">
                            DIGITAL CARE PACKAGE
                        </div>


                        <div class="label-content">

                            <p>
                                <b>TO:</b>
                                my bestie ♡
                            </p>

                            <p>
                                <b>FROM:</b>
                                someone who loves you ♡
                            </p>


                            <div class="divider"></div>


                            <div class="resi-title">
                                NO. RESI
                            </div>


                            <!-- BARCODE -->
                            <div class="barcode-wrapper">

                                <div class="barcode">

                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>

                                </div>


                                <div class="barcode-number">
                                    01112006 01112026
                                </div>

                            </div>


                            <div class="small-text">
                                HANDLE WITH CARE ♡
                            </div>

                        </div>

                    </div>


                    <!-- HEART -->
                    <div class="heart-sticker">
                        ♡
                    </div>

                </div>


                <!-- RIBBON -->
                <div class="ribbon ribbon-left"></div>

                <div class="ribbon ribbon-right"></div>

            </div>

        </section>


        <!-- =================================
             INSTRUCTION
        ================================== -->

        <div
            class="instruction"
            id="instruction"
        >

            <span>
                👆
            </span>

            tap the package to open ♡

        </div>


        <p
            class="opening-message"
            id="openingMessage"
        >
            there's something special inside...
        </p>

    </main>


    <script src="package.js"></script>

</body>
</html>
